<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>DepsStore · Login</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Days+One&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background: linear-gradient(145deg, #fafdff 0%, #f0f7ff 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 1.5rem;
        }
        
        .login-card {
            background: white;
            border-radius: 1.5rem;
            border: 1px solid rgba(191, 219, 254, 0.2);
            padding: 2.5rem 2rem;
            max-width: 420px;
            width: 100%;
            box-shadow: 0 20px 60px -12px rgba(37, 99, 235, 0.08);
        }
        
        .login-card .brand-text {
            font-family: 'Days One', sans-serif;
            font-size: 1.8rem;
            font-weight: 300;
            color: #1e3a8a;
            letter-spacing: 0.04em;
            text-align: center;
            display: block;
        }
        
        .login-card .brand-text span {
            font-weight: 600;
            color: #2563eb;
        }
        
        .login-card .subtitle {
            text-align: center;
            color: #6b8bb0;
            font-size: 0.9rem;
            margin-top: 0.25rem;
        }
        
        .login-card .divider {
            width: 44px;
            height: 2px;
            background: linear-gradient(90deg, #2563eb, #93c5fd);
            margin: 1rem auto 1.5rem auto;
            border-radius: 4px;
            opacity: 0.6;
        }
        
        .login-card label {
            font-size: 0.8rem;
            font-weight: 500;
            color: #1e3a8a;
            display: block;
            margin-bottom: 0.25rem;
        }
        
        .login-card input {
            width: 100%;
            padding: 0.65rem 1rem;
            border: 1px solid rgba(191, 219, 254, 0.3);
            border-radius: 0.75rem;
            font-size: 0.9rem;
            transition: border-color 0.2s;
            outline: none;
            background: white;
            color: #1a2744;
        }
        
        .login-card input:focus {
            border-color: #93c5fd;
            box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.06);
        }
        
        .login-card .input-group {
            margin-bottom: 1rem;
        }
        
        .login-card .btn-login {
            width: 100%;
            padding: 0.75rem;
            background: #2563eb;
            color: white;
            border: none;
            border-radius: 0.75rem;
            font-size: 0.95rem;
            font-weight: 500;
            cursor: pointer;
            transition: background 0.2s;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.5rem;
        }
        
        .login-card .btn-login:hover {
            background: #1d4ed8;
        }
        
        .login-card .btn-login:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }
        
        .login-card .register-link {
            text-align: center;
            margin-top: 1.25rem;
            font-size: 0.85rem;
            color: #6b8bb0;
        }
        
        .login-card .register-link a {
            color: #2563eb;
            text-decoration: none;
            font-weight: 500;
        }
        
        .login-card .register-link a:hover {
            text-decoration: underline;
        }
        
        .login-card .alert {
            padding: 0.75rem 1rem;
            border-radius: 0.75rem;
            font-size: 0.85rem;
            margin-bottom: 1rem;
            display: none;
        }
        
        .login-card .alert.success {
            display: block;
            background: #dcfce7;
            color: #166534;
            border: 1px solid #bbf7d0;
        }
        
        .login-card .alert.error {
            display: block;
            background: #fee2e2;
            color: #991b1b;
            border: 1px solid #fecaca;
        }
        
        .login-card .alert.info {
            display: block;
            background: #dbeafe;
            color: #1e3a8a;
            border: 1px solid #bfdbfe;
        }
        
        .login-card .password-wrapper {
            position: relative;
        }
        
        .login-card .password-wrapper .toggle-password {
            position: absolute;
            right: 1rem;
            top: 50%;
            transform: translateY(-50%);
            color: #6b8bb0;
            cursor: pointer;
            background: none;
            border: none;
            font-size: 1rem;
        }
        
        .login-card .password-wrapper .toggle-password:hover {
            color: #1e3a8a;
        }
        
        .login-card .forgot-password {
            text-align: right;
            font-size: 0.75rem;
            margin-top: 0.25rem;
        }
        
        .login-card .forgot-password a {
            color: #6b8bb0;
            text-decoration: none;
        }
        
        .login-card .forgot-password a:hover {
            color: #2563eb;
        }
        
        .login-card .social-login {
            display: flex;
            gap: 0.75rem;
            margin-top: 1.25rem;
            justify-content: center;
        }
        
        .login-card .social-login button {
            flex: 1;
            padding: 0.55rem;
            border: 1px solid rgba(191, 219, 254, 0.3);
            border-radius: 0.75rem;
            background: white;
            cursor: pointer;
            transition: background 0.2s;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.5rem;
            font-size: 0.8rem;
            color: #1e3a8a;
        }
        
        .login-card .social-login button:hover {
            background: #f0f6fe;
        }
        
        .login-card .social-login button i {
            font-size: 1.1rem;
        }
        
        .login-card .demo-credentials {
            background: #f8faff;
            border-radius: 0.75rem;
            padding: 0.75rem 1rem;
            margin-bottom: 1.25rem;
            font-size: 0.8rem;
            color: #4b6a8b;
            border: 1px dashed rgba(191, 219, 254, 0.3);
        }
        
        .login-card .demo-credentials strong {
            color: #1e3a8a;
        }
        
        @media (max-width: 480px) {
            .login-card {
                padding: 1.75rem 1.25rem;
            }
            .login-card .brand-text {
                font-size: 1.5rem;
            }
            .login-card .social-login {
                flex-direction: column;
            }
        }
    </style>
</head>

<body>

    <div class="login-card">

        <!-- Brand -->
        <span class="brand-text">Deps<span>Store</span></span>
        <p class="subtitle">Masuk ke akun Anda</p>
        <div class="divider"></div>

        <!-- Demo Credentials -->
        <div class="demo-credentials">
            <i class="fas fa-info-circle text-blue-400 mr-1"></i>
            <strong>Demo:</strong>
            <span id="demoEmail">adm1ndepsstore@gmail.com</span> /
            <span id="demoPassword">Admin@123456</span>
            <button onclick="fillDemo()" style="background:none;border:none;color:#2563eb;cursor:pointer;font-weight:500;font-size:0.75rem;padding:0;">
            <i class="fas fa-paste"></i> Isi otomatis
        </button>
        </div>

        <!-- Alert -->
        <div id="loginAlert" class="alert"></div>

        <!-- Form -->
        <form id="loginForm" novalidate>
            <div class="input-group">
                <label for="loginEmail">Alamat Email</label>
                <input type="email" id="loginEmail" placeholder="email@example.com" required />
            </div>

            <div class="input-group">
                <label for="loginPassword">Kata Sandi</label>
                <div class="password-wrapper">
                    <input type="password" id="loginPassword" placeholder="Masukkan kata sandi" required />
                    <button type="button" class="toggle-password" onclick="togglePassword()">
                    <i class="fas fa-eye" id="passwordIcon"></i>
                </button>
                </div>
                <div class="forgot-password">
                    <a href="#">Lupa kata sandi?</a>
                </div>
            </div>

            <button type="submit" class="btn-login" id="loginBtn">
            <i class="fas fa-sign-in-alt"></i> Masuk
        </button>
        </form>

        <div class="register-link">
            Belum punya akun? <a href="register.html">Daftar sekarang</a>
        </div>

        <!-- Social Login -->
        <div class="social-login">
            <button onclick="alert('Login dengan Google')">
            <i class="fab fa-google" style="color:#ea4335;"></i> Google
        </button>
            <button onclick="alert('Login dengan Facebook')">
            <i class="fab fa-facebook" style="color:#1877f2;"></i> Facebook
        </button>
        </div>

    </div>

    <script>
        // ============================================================
        // KONFIGURASI
        // ============================================================

        var API_URL = 'http://localhost:3000';

        // ============================================================
        // ELEMEN
        // ============================================================

        var form = document.getElementById('loginForm');
        var emailInput = document.getElementById('loginEmail');
        var passwordInput = document.getElementById('loginPassword');
        var alertEl = document.getElementById('loginAlert');
        var loginBtn = document.getElementById('loginBtn');

        // ============================================================
        // FUNGSI HELPERS
        // ============================================================

        function showAlert(message, type) {
            alertEl.className = 'alert ' + type;
            alertEl.textContent = message;
            alertEl.style.display = 'block';
        }

        function hideAlert() {
            alertEl.style.display = 'none';
        }

        function togglePassword() {
            var input = document.getElementById('loginPassword');
            var icon = document.getElementById('passwordIcon');
            if (input.type === 'password') {
                input.type = 'text';
                icon.className = 'fas fa-eye-slash';
            } else {
                input.type = 'password';
                icon.className = 'fas fa-eye';
            }
        }

        function fillDemo() {
            document.getElementById('loginEmail').value = 'adm1ndepsstore@gmail.com';
            document.getElementById('loginPassword').value = 'Admin@123456';
            showAlert('✅ Data demo telah diisi', 'info');
        }

        // ============================================================
        // LOGIN HANDLER
        // ============================================================

        form.addEventListener('submit', function(e) {
            e.preventDefault();
            hideAlert();

            var email = emailInput.value.trim();
            var password = passwordInput.value.trim();

            // Validasi
            if (!email || !password) {
                showAlert('⚠️ Email dan kata sandi wajib diisi', 'error');
                return;
            }

            if (!email.includes('@')) {
                showAlert('⚠️ Format email tidak valid', 'error');
                return;
            }

            // Disable tombol
            loginBtn.disabled = true;
            loginBtn.innerHTML = '<span class="spinner"></span> Memproses...';

            // Kirim request
            fetch(API_URL + '/api/v2/auth/login', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        email: email,
                        password: password
                    })
                })
                .then(function(res) {
                    return res.json();
                })
                .then(function(data) {
                    loginBtn.disabled = false;
                    loginBtn.innerHTML = '<i class="fas fa-sign-in-alt"></i> Masuk';

                    if (data.success) {
                        // Simpan token
                        localStorage.setItem('depsstore_token', data.data.token);
                        localStorage.setItem('depsstore_user', JSON.stringify(data.data.user));

                        showAlert('✅ Login berhasil! Mengalihkan...', 'success');

                        // Redirect setelah 1.5 detik
                        setTimeout(function() {
                            window.location.href = '../dashboard.html';
                        }, 1500);
                    } else {
                        showAlert('❌ ' + (data.message || data.error || 'Login gagal'), 'error');
                    }
                })
                .catch(function(err) {
                    loginBtn.disabled = false;
                    loginBtn.innerHTML = '<i class="fas fa-sign-in-alt"></i> Masuk';
                    showAlert('❌ Gagal terhubung ke server: ' + err.message, 'error');
                });
        });

        // ============================================================
        // ENTER KEY SUPPORT
        // ============================================================

        document.addEventListener('keydown', function(e) {
            if (e.key === 'Enter') {
                var active = document.activeElement;
                if (active === emailInput || active === passwordInput) {
                    form.dispatchEvent(new Event('submit'));
                }
            }
        });

        // ============================================================
        // STYLE UNTUK SPINNER
        // ============================================================

        var style = document.createElement('style');
        style.textContent = `
        .spinner {
            display: inline-block;
            width: 16px;
            height: 16px;
            border: 2px solid rgba(255,255,255,0.3);
            border-radius: 50%;
            border-top-color: #fff;
            animation: spin 0.6s linear infinite;
        }
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
    `;
        document.head.appendChild(style);

        console.log('✅ Login page siap');
        console.log('🔑 Demo: adm1ndepsstore@gmail.com / Admin@123456');
    </script>

</body>

</html>
