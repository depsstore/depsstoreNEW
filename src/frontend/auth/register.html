<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>DepsStore · Daftar</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Days+One&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background: linear-gradient(145deg, #fafdff 0%, #f0f7ff 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 1.5rem;
        }
        
        .register-card {
            background: white;
            border-radius: 1.5rem;
            border: 1px solid rgba(191, 219, 254, 0.2);
            padding: 2.5rem 2rem;
            max-width: 420px;
            width: 100%;
            box-shadow: 0 20px 60px -12px rgba(37, 99, 235, 0.08);
        }
        
        .register-card .brand-text {
            font-family: 'Days One', sans-serif;
            font-size: 1.8rem;
            font-weight: 300;
            color: #1e3a8a;
            letter-spacing: 0.04em;
            text-align: center;
            display: block;
        }
        
        .register-card .brand-text span {
            font-weight: 600;
            color: #2563eb;
        }
        
        .register-card .subtitle {
            text-align: center;
            color: #6b8bb0;
            font-size: 0.9rem;
            margin-top: 0.25rem;
        }
        
        .register-card .divider {
            width: 44px;
            height: 2px;
            background: linear-gradient(90deg, #2563eb, #93c5fd);
            margin: 1rem auto 1.5rem auto;
            border-radius: 4px;
            opacity: 0.6;
        }
        
        .register-card label {
            font-size: 0.8rem;
            font-weight: 500;
            color: #1e3a8a;
            display: block;
            margin-bottom: 0.25rem;
        }
        
        .register-card input {
            width: 100%;
            padding: 0.65rem 1rem;
            border: 1px solid rgba(191, 219, 254, 0.3);
            border-radius: 0.75rem;
            font-size: 0.9rem;
            transition: border-color 0.2s;
            outline: none;
            background: white;
            color: #1a2744;
        }
        
        .register-card input:focus {
            border-color: #93c5fd;
            box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.06);
        }
        
        .register-card .input-group {
            margin-bottom: 1rem;
        }
        
        .register-card .btn-register {
            width: 100%;
            padding: 0.75rem;
            background: #2563eb;
            color: white;
            border: none;
            border-radius: 0.75rem;
            font-size: 0.95rem;
            font-weight: 500;
            cursor: pointer;
            transition: background 0.2s;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.5rem;
        }
        
        .register-card .btn-register:hover {
            background: #1d4ed8;
        }
        
        .register-card .btn-register:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }
        
        .register-card .login-link {
            text-align: center;
            margin-top: 1.25rem;
            font-size: 0.85rem;
            color: #6b8bb0;
        }
        
        .register-card .login-link a {
            color: #2563eb;
            text-decoration: none;
            font-weight: 500;
        }
        
        .register-card .login-link a:hover {
            text-decoration: underline;
        }
        
        .register-card .alert {
            padding: 0.75rem 1rem;
            border-radius: 0.75rem;
            font-size: 0.85rem;
            margin-bottom: 1rem;
            display: none;
        }
        
        .register-card .alert.success {
            display: block;
            background: #dcfce7;
            color: #166534;
            border: 1px solid #bbf7d0;
        }
        
        .register-card .alert.error {
            display: block;
            background: #fee2e2;
            color: #991b1b;
            border: 1px solid #fecaca;
        }
        
        .register-card .password-wrapper {
            position: relative;
        }
        
        .register-card .password-wrapper .toggle-password {
            position: absolute;
            right: 1rem;
            top: 50%;
            transform: translateY(-50%);
            color: #6b8bb0;
            cursor: pointer;
            background: none;
            border: none;
            font-size: 1rem;
        }
        
        .register-card .password-wrapper .toggle-password:hover {
            color: #1e3a8a;
        }
        
        .register-card .terms {
            font-size: 0.75rem;
            color: #6b8bb0;
            text-align: center;
            margin-top: 0.75rem;
        }
        
        .register-card .terms a {
            color: #2563eb;
            text-decoration: none;
        }
        
        .register-card .terms a:hover {
            text-decoration: underline;
        }
        
        @media (max-width: 480px) {
            .register-card {
                padding: 1.75rem 1.25rem;
            }
            .register-card .brand-text {
                font-size: 1.5rem;
            }
        }
        
        .spinner {
            display: inline-block;
            width: 16px;
            height: 16px;
            border: 2px solid rgba(255, 255, 255, 0.3);
            border-radius: 50%;
            border-top-color: #fff;
            animation: spin 0.6s linear infinite;
        }
        
        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }
    </style>
</head>

<body>

    <div class="register-card">

        <!-- Brand -->
        <span class="brand-text">Deps<span>Store</span></span>
        <p class="subtitle">Buat akun baru</p>
        <div class="divider"></div>

        <!-- Alert -->
        <div id="registerAlert" class="alert"></div>

        <!-- Form -->
        <form id="registerForm" novalidate>
            <div class="input-group">
                <label for="registerName">Nama Lengkap</label>
                <input type="text" id="registerName" placeholder="Nama lengkap Anda" required />
            </div>

            <div class="input-group">
                <label for="registerEmail">Alamat Email</label>
                <input type="email" id="registerEmail" placeholder="email@example.com" required />
            </div>

            <div class="input-group">
                <label for="registerPassword">Kata Sandi</label>
                <div class="password-wrapper">
                    <input type="password" id="registerPassword" placeholder="Minimal 12 karakter" required />
                    <button type="button" class="toggle-password" onclick="togglePassword()">
                    <i class="fas fa-eye" id="passwordIcon"></i>
                </button>
                </div>
            </div>

            <button type="submit" class="btn-register" id="registerBtn">
            <i class="fas fa-user-plus"></i> Daftar
        </button>
        </form>

        <div class="login-link">
            Sudah punya akun? <a href="login.html">Masuk sekarang</a>
        </div>

        <div class="terms">
            Dengan mendaftar, Anda menyetujui <a href="#">Syarat &amp; Ketentuan</a> dan <a href="#">Kebijakan Privasi</a> kami.
        </div>

    </div>

    <script>
        // ============================================================
        // KONFIGURASI
        // ============================================================

        var API_URL = 'http://localhost:3000';

        // ============================================================
        // ELEMEN
        // ============================================================

        var form = document.getElementById('registerForm');
        var nameInput = document.getElementById('registerName');
        var emailInput = document.getElementById('registerEmail');
        var passwordInput = document.getElementById('registerPassword');
        var alertEl = document.getElementById('registerAlert');
        var registerBtn = document.getElementById('registerBtn');

        // ============================================================
        // FUNGSI HELPERS
        // ============================================================

        function showAlert(message, type) {
            alertEl.className = 'alert ' + type;
            alertEl.textContent = message;
            alertEl.style.display = 'block';
        }

        function hideAlert() {
            alertEl.style.display = 'none';
        }

        function togglePassword() {
            var input = document.getElementById('registerPassword');
            var icon = document.getElementById('passwordIcon');
            if (input.type === 'password') {
                input.type = 'text';
                icon.className = 'fas fa-eye-slash';
            } else {
                input.type = 'password';
                icon.className = 'fas fa-eye';
            }
        }

        // ============================================================
        // REGISTER HANDLER
        // ============================================================

        form.addEventListener('submit', function(e) {
            e.preventDefault();
            hideAlert();

            var name = nameInput.value.trim();
            var email = emailInput.value.trim();
            var password = passwordInput.value.trim();

            // Validasi
            if (!name || name.length < 2) {
                showAlert('⚠️ Nama minimal 2 karakter', 'error');
                return;
            }

            if (!email || !email.includes('@')) {
                showAlert('⚠️ Email tidak valid', 'error');
                return;
            }

            if (!password || password.length < 8) {
                showAlert('⚠️ Kata sandi minimal 8 karakter', 'error');
                return;
            }

            // Disable tombol
            registerBtn.disabled = true;
            registerBtn.innerHTML = '<span class="spinner"></span> Memproses...';

            // Kirim request
            fetch(API_URL + '/api/v2/auth/register', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        name: name,
                        email: email,
                        password: password
                    })
                })
                .then(function(res) {
                    return res.json();
                })
                .then(function(data) {
                    registerBtn.disabled = false;
                    registerBtn.innerHTML = '<i class="fas fa-user-plus"></i> Daftar';

                    if (data.success) {
                        showAlert('✅ Pendaftaran berhasil! Silakan login.', 'success');
                        form.reset();
                        setTimeout(function() {
                            window.location.href = 'login.html';
                        }, 2000);
                    } else {
                        var msg = data.message || data.error || 'Pendaftaran gagal';
                        if (data.errors) {
                            var errors = Object.values(data.errors).join(', ');
                            msg = errors || msg;
                        }
                        showAlert('❌ ' + msg, 'error');
                    }
                })
                .catch(function(err) {
                    registerBtn.disabled = false;
                    registerBtn.innerHTML = '<i class="fas fa-user-plus"></i> Daftar';
                    showAlert('❌ Gagal terhubung ke server: ' + err.message, 'error');
                });
        });

        // ============================================================
        // ENTER KEY SUPPORT
        // ============================================================

        document.addEventListener('keydown', function(e) {
            if (e.key === 'Enter') {
                var active = document.activeElement;
                if (active === nameInput || active === emailInput || active === passwordInput) {
                    form.dispatchEvent(new Event('submit'));
                }
            }
        });

        console.log('✅ Register page siap');
    </script>

</body>

</html>
